spring.application.name=midterm-exam

spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.datasource.url=jdbc:mariadb://localhost:13306/book
spring.datasource.username=root
spring.datasource.password=qwer1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

mybatis.mapper-locations=classpath:/mybatis/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

logging.level.root=INFO
logging.level.mybatis=DEBUG
logging.level.mybatis.spring=DEBUG
logging.level.jdbc.sqlonly=DEBUG
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultsettable=DEBUG
logging.level.com.framework=DEBUG
logging.level.com.springframework=INFO
logging.level.org.thymeleaf=WARN
logging.file.name=logs/app.log